<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Plugin Store icon and the marketing-site logo.

  Self-coloured on purpose: there is no `currentColor` to inherit in either of those places. The
  control panel nav uses icon-mask.svg, which is the same drawing as a monochrome silhouette.

  Rounded tile at 22.44% radius, the family's app-icon shape. Cobalt rather than the obvious
  glue-bottle orange, which is already taken twice over by Heat's ember and Smoke's rust.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#2E5BBA"/>
  <g transform="translate(10 10) scale(3.3333)" fill="none" stroke="#FEFEFE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.7 6.1 11.4 2.6h1.2l.7 3.5z"/>
    <path d="M10.7 6.1v1.5c0 .9-.6 1.4-1.3 2-1.2 1-2.1 2-2.1 3.6V19a2.2 2.2 0 0 0 2.2 2.2h5a2.2 2.2 0 0 0 2.2-2.2v-5.8c0-1.6-.9-2.6-2.1-3.6-.7-.6-1.3-1.1-1.3-2V6.1"/>
    <path d="M9.1 14.7h5.8"/>
    <path d="M9.1 17.4h3.6"/>
    <path d="M19 5.9c.9 1.1 1.4 1.9 1.4 2.5a1.4 1.4 0 0 1-2.8 0c0-.6.5-1.4 1.4-2.5z"/>
  </g>
</svg>
